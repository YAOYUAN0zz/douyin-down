<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Douyin Downloader</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1f2329; --muted: #6b7280;
    --border: #e5e7eb; --primary: #1e66f5; --primary-hover: #1554d1;
    --ok: #16a34a; --warn: #d97706; --err: #dc2626; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 14px; line-height: 1.6;
  }
  .container { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); margin: 0 0 8px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 20px;
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 8px; padding: 7px 14px; cursor: pointer; font-size: 14px;
  }
  button:hover { background: #f3f4f6; }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  button.primary:hover { background: var(--primary-hover); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  input[type=text] {
    flex: 1; min-width: 260px; border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; font-size: 14px; outline: none;
  }
  input[type=text]:focus { border-color: var(--primary); }
  select {
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px;
    font-size: 14px; background: var(--card); color: var(--text);
  }
  .quality-cell { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px; border-radius: 999px;
    padding: 2px 10px; font-size: 12px; border: 1px solid var(--border);
  }
  .badge.ok { color: var(--ok); border-color: rgba(22,163,74,.35); background: rgba(22,163,74,.08); }
  .badge.err { color: var(--err); border-color: rgba(220,38,38,.35); background: rgba(220,38,38,.08); }
  .hint { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .flow-msg { margin-top: 10px; font-size: 13px; }
  .flow-msg.ok { color: var(--ok); }
  .flow-msg.err { color: var(--err); }
  .flow-msg.run { color: var(--warn); }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { color: var(--muted); font-weight: 600; }
  td.url { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status-pending { color: var(--muted); }
  .status-running { color: var(--warn); }
  .status-success { color: var(--ok); }
  .status-failed { color: var(--err); }
  .empty { color: var(--muted); padding: 12px 0; }
  td.works-desc { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cover-thumb {
    width: 48px; height: 64px; object-fit: cover; border-radius: 6px;
    background: #eceef1; display: block;
  }
  .works-toolbar { margin-top: 12px; }
  .works-count { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="container">
  <div>
    <h1>Douyin Downloader</h1>
    <p class="subtitle">粘贴抖音链接提交下载任务；下载参数（Cookie / msToken）可一键自动获取。</p>
  </div>

  <div class="card">
    <h2>下载参数状态</h2>
    <div class="row" id="auth-badges"><span class="empty">加载中…</span></div>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="btn-fetch">自动获取参数</button>
      <button id="btn-confirm" hidden>我已完成登录</button>
      <button id="btn-cancel" hidden>取消</button>
      <button id="btn-refresh">刷新状态</button>
    </div>
    <div class="flow-msg" id="flow-msg" hidden></div>
    <p class="hint">
      点击「自动获取参数」后，服务器会打开一个浏览器窗口；在其中登录抖音后会自动检测并保存参数。
      若长时间未自动完成，可点「我已完成登录」手动确认。需要已安装 Playwright。
    </p>
  </div>

  <div class="card">
    <h2>提交下载</h2>
    <div class="row">
      <input type="text" id="url-input"
             placeholder="https://www.douyin.com/video/... 或 https://v.douyin.com/... 短链">
      <select id="submit-quality" title="视频画质">
        <option value="">画质：跟随配置</option>
        <option value="original">原画（探测上传原片）</option>
        <option value="highest">最高码率档</option>
        <option value="1440p">1440p</option>
        <option value="1080p">1080p</option>
        <option value="720p">720p</option>
        <option value="540p">540p</option>
        <option value="480p">480p</option>
        <option value="360p">360p</option>
        <option value="lowest">最低码率档</option>
      </select>
      <button class="primary" id="btn-submit">开始下载</button>
    </div>
    <div class="flow-msg" id="submit-msg" hidden></div>
  </div>

  <div class="card">
    <h2>作品列表（按需下载）</h2>
    <div class="row">
      <input type="text" id="works-url-input"
             placeholder="主页 / 合集 / 音乐 / 单作品链接，先获取列表再勾选下载">
      <button class="primary" id="btn-works-fetch">获取列表</button>
    </div>
    <div class="flow-msg" id="works-msg" hidden></div>
    <div id="works-area"></div>
    <div class="row works-toolbar" id="works-toolbar" hidden>
      <select id="works-quality" title="视频画质">
        <option value="">画质：跟随配置</option>
        <option value="original">原画（探测上传原片）</option>
        <option value="highest">最高码率档</option>
        <option value="1440p">1440p</option>
        <option value="1080p">1080p</option>
        <option value="720p">720p</option>
        <option value="540p">540p</option>
        <option value="480p">480p</option>
        <option value="360p">360p</option>
        <option value="lowest">最低码率档</option>
      </select>
      <button class="primary" id="btn-works-download">下载选中</button>
      <button id="btn-works-more" hidden>加载更多</button>
      <span class="works-count" id="works-count"></span>
    </div>
  </div>

  <div class="card">
    <h2>任务列表</h2>
    <div id="jobs-area"><div class="empty">暂无任务</div></div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var API = "/api/v1";
  var flowPollTimer = null;

  function $(id) { return document.getElementById(id); }

  function api(path, opts) {
    return fetch(API + path, opts).then(function (resp) {
      return resp.json().catch(function () { return {}; }).then(function (body) {
        if (!resp.ok) {
          var detail = body && body.detail ? body.detail : ("HTTP " + resp.status);
          throw new Error(detail);
        }
        return body;
      });
    });
  }

  function setMsg(el, text, cls) {
    el.hidden = !text;
    el.textContent = text || "";
    el.className = "flow-msg" + (cls ? " " + cls : "");
  }

  // ---------------- 参数状态 ----------------
  function renderAuthStatus(data) {
    var box = $("auth-badges");
    box.innerHTML = "";
    (data.required || []).forEach(function (key) {
      var missing = (data.missing || []).indexOf(key) !== -1;
      var span = document.createElement("span");
      span.className = "badge " + (missing ? "err" : "ok");
      span.textContent = (missing ? "✗ " : "✓ ") + key;
      box.appendChild(span);
    });
    var session = document.createElement("span");
    session.className = "badge " + (data.has_session ? "ok" : "err");
    session.textContent = data.has_session ? "✓ 已登录会话" : "✗ 未检测到登录会话";
    box.appendChild(session);
    var count = document.createElement("span");
    count.className = "badge";
    count.textContent = "共 " + (data.cookie_count || 0) + " 个 cookie";
    box.appendChild(count);
  }

  function refreshAuthStatus() {
    return api("/auth/status").then(renderAuthStatus).catch(function (err) {
      $("auth-badges").innerHTML =
        '<span class="badge err">状态获取失败：' + err.message + "</span>";
    });
  }

  // ---------------- 自动获取流程 ----------------
  function setFlowRunning(running) {
    $("btn-fetch").disabled = running;
    $("btn-confirm").hidden = !running;
    $("btn-cancel").hidden = !running;
  }

  function pollFlowStatus() {
    api("/auth/fetch/status").then(function (data) {
      if (data.status === "running") {
        setFlowRunning(true);
        setMsg($("flow-msg"), data.message || "获取中……", "run");
        return;
      }
      setFlowRunning(false);
      stopFlowPolling();
      if (data.status === "success") {
        setMsg($("flow-msg"), data.message || "获取成功。", "ok");
        refreshAuthStatus();
      } else if (data.status === "failed") {
        setMsg($("flow-msg"), data.message || "获取失败。", "err");
      } else if (data.status === "cancelled") {
        setMsg($("flow-msg"), data.message || "已取消。", "");
      }
    }).catch(function (err) {
      setFlowRunning(false);
      stopFlowPolling();
      setMsg($("flow-msg"), "状态查询失败：" + err.message, "err");
    });
  }

  function startFlowPolling() {
    stopFlowPolling();
    flowPollTimer = setInterval(pollFlowStatus, 2000);
    pollFlowStatus();
  }

  function stopFlowPolling() {
    if (flowPollTimer) { clearInterval(flowPollTimer); flowPollTimer = null; }
  }

  $("btn-fetch").addEventListener("click", function () {
    setMsg($("flow-msg"), "正在启动浏览器……", "run");
    api("/auth/fetch", { method: "POST" }).then(function () {
      setFlowRunning(true);
      startFlowPolling();
    }).catch(function (err) {
      setMsg($("flow-msg"), "启动失败：" + err.message, "err");
    });
  });

  $("btn-confirm").addEventListener("click", function () {
    api("/auth/fetch/confirm", { method: "POST" }).catch(function (err) {
      setMsg($("flow-msg"), "确认失败：" + err.message, "err");
    });
  });

  $("btn-cancel").addEventListener("click", function () {
    api("/auth/fetch/cancel", { method: "POST" }).catch(function (err) {
      setMsg($("flow-msg"), "取消失败：" + err.message, "err");
    });
  });

  $("btn-refresh").addEventListener("click", refreshAuthStatus);

  // ---------------- 下载提交与任务列表 ----------------
  $("btn-submit").addEventListener("click", submitDownload);
  $("url-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter") submitDownload();
  });

  function submitDownload() {
    var url = $("url-input").value.trim();
    if (!url) {
      setMsg($("submit-msg"), "请输入抖音链接。", "err");
      return;
    }
    setMsg($("submit-msg"), "提交中……", "run");
    var payload = { url: url };
    var quality = $("submit-quality").value;
    if (quality) payload.video_quality = quality;
    api("/download", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    }).then(function (job) {
      setMsg($("submit-msg"), "已提交任务 " + job.job_id + "。", "ok");
      $("url-input").value = "";
      refreshJobs();
    }).catch(function (err) {
      setMsg($("submit-msg"), "提交失败：" + err.message, "err");
    });
  }

  // ---------------- 作品列表（按需下载） ----------------
  var worksState = { url: "", items: [], selected: {}, cursor: 0, hasMore: false, loading: false };

  $("btn-works-fetch").addEventListener("click", function () { fetchWorks(false); });
  $("works-url-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter") fetchWorks(false);
  });
  $("btn-works-more").addEventListener("click", function () { fetchWorks(true); });
  $("btn-works-download").addEventListener("click", downloadSelectedWorks);

  function fetchWorks(loadMore) {
    if (worksState.loading) return;
    var url = loadMore ? worksState.url : $("works-url-input").value.trim();
    if (!url) {
      setMsg($("works-msg"), "请输入链接。", "err");
      return;
    }
    worksState.loading = true;
    $("btn-works-fetch").disabled = true;
    $("btn-works-more").disabled = true;
    setMsg($("works-msg"), loadMore ? "加载更多中……" : "获取作品列表中……", "run");
    api("/works/list", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: url, cursor: loadMore ? worksState.cursor : 0 }),
    }).then(function (data) {
      if (!loadMore) {
        worksState.url = url;
        worksState.items = [];
        worksState.selected = {};
      }
      var fresh = (data.items || []).filter(function (item) {
        return !worksState.items.some(function (existing) {
          return existing.aweme_id === item.aweme_id;
        });
      });
      worksState.items = worksState.items.concat(fresh);
      worksState.cursor = data.cursor || 0;
      worksState.hasMore = !!data.has_more;
      setMsg($("works-msg"),
        "已获取 " + worksState.items.length + " 个作品" + (worksState.hasMore ? "（还有更多）" : "") + "。",
        "ok");
      renderWorks();
    }).catch(function (err) {
      setMsg($("works-msg"), "获取失败：" + err.message, "err");
    }).finally(function () {
      worksState.loading = false;
      $("btn-works-fetch").disabled = false;
      $("btn-works-more").disabled = false;
    });
  }

  function selectedWorkIds() {
    return worksState.items.filter(function (item) {
      return worksState.selected[item.aweme_id];
    });
  }

  function renderWorks() {
    var area = $("works-area");
    var toolbar = $("works-toolbar");
    if (!worksState.items.length) {
      area.innerHTML = "";
      toolbar.hidden = true;
      return;
    }
    var allChecked = worksState.items.every(function (item) {
      return worksState.selected[item.aweme_id];
    });
    var rows = worksState.items.map(function (item) {
      var checked = worksState.selected[item.aweme_id] ? " checked" : "";
      var cover = item.cover
        ? '<img class="cover-thumb" loading="lazy" referrerpolicy="no-referrer" src="' +
          escapeHtml(item.cover) + '" alt="">'
        : '<div class="cover-thumb"></div>';
      var typeText = item.media_type === "images"
        ? "图集×" + (item.image_count || "?")
        : "视频 " + formatDuration(item.duration_seconds);
      return "<tr>" +
        '<td><input type="checkbox" class="works-check" data-id="' + escapeHtml(item.aweme_id) + '"' + checked + "></td>" +
        "<td>" + cover + "</td>" +
        '<td class="works-desc" title="' + escapeHtml(item.desc) + '">' +
          (escapeHtml(item.desc) || "（无描述）") + "</td>" +
        "<td>" + typeText + "</td>" +
        "<td>" + renderQualities(item) + "</td>" +
        "<td>" + formatEpoch(item.create_time) + "</td>" +
        "<td>" + formatCount(item.stats && item.stats.digg_count) + "</td>" +
        "</tr>";
    }).join("");
    area.innerHTML =
      "<table><thead><tr>" +
      '<th><input type="checkbox" id="works-check-all"' + (allChecked ? " checked" : "") + "></th>" +
      "<th>封面</th><th>描述</th><th>类型</th><th>画质</th><th>发布时间</th><th>点赞</th>" +
      "</tr></thead><tbody>" + rows + "</tbody></table>";
    toolbar.hidden = false;
    $("btn-works-more").hidden = !worksState.hasMore;
    updateWorksCount();

    $("works-check-all").addEventListener("change", function (e) {
      worksState.items.forEach(function (item) {
        worksState.selected[item.aweme_id] = e.target.checked;
      });
      Array.prototype.forEach.call(document.querySelectorAll(".works-check"), function (cb) {
        cb.checked = e.target.checked;
      });
      updateWorksCount();
    });
    Array.prototype.forEach.call(document.querySelectorAll(".works-check"), function (cb) {
      cb.addEventListener("change", function () {
        worksState.selected[cb.getAttribute("data-id")] = cb.checked;
        var all = worksState.items.every(function (item) {
          return worksState.selected[item.aweme_id];
        });
        $("works-check-all").checked = all;
        updateWorksCount();
      });
    });
  }

  function updateWorksCount() {
    var n = selectedWorkIds().length;
    $("works-count").textContent = "已选 " + n + " / " + worksState.items.length + " 个作品";
    $("btn-works-download").disabled = n === 0;
  }

  function downloadSelectedWorks() {
    var picked = selectedWorkIds();
    if (!picked.length) return;
    $("btn-works-download").disabled = true;
    setMsg($("works-msg"), "提交 " + picked.length + " 个下载任务中……", "run");
    var payload = { urls: picked.map(function (item) { return item.download_url; }) };
    var quality = $("works-quality").value;
    if (quality) payload.video_quality = quality;
    api("/download/batch", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    }).then(function (data) {
      setMsg($("works-msg"), "已提交 " + (data.jobs || []).length + " 个下载任务。", "ok");
      refreshJobs();
    }).catch(function (err) {
      setMsg($("works-msg"), "提交失败：" + err.message, "err");
    }).finally(function () {
      $("btn-works-download").disabled = false;
      updateWorksCount();
    });
  }

  function renderQualities(item) {
    if (item.media_type === "images") return '<span class="quality-cell">-</span>';
    var qualities = item.qualities || [];
    if (!qualities.length) return '<span class="quality-cell">未知</span>';
    var labels = [];
    var seen = {};
    var titleParts = [];
    qualities.forEach(function (q) {
      if (!seen[q.label]) { seen[q.label] = true; labels.push(q.label); }
      titleParts.push(
        q.label + " " + q.width + "x" + q.height +
        (q.size_bytes ? " · " + formatBytes(q.size_bytes) : "") +
        (q.bit_rate ? " · " + Math.round(q.bit_rate / 1000) + "kbps" : "") +
        (q.format ? " · " + q.format : "")
      );
    });
    return '<span class="quality-cell" title="' + escapeHtml(titleParts.join("\n")) + '">' +
      escapeHtml(labels.join(" / ")) + "</span>";
  }

  function formatBytes(bytes) {
    bytes = parseInt(bytes, 10) || 0;
    if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + "MB";
    if (bytes >= 1024) return Math.round(bytes / 1024) + "KB";
    return bytes + "B";
  }

  function formatDuration(seconds) {
    seconds = parseInt(seconds, 10) || 0;
    var m = Math.floor(seconds / 60);
    var s = seconds % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function formatEpoch(epoch) {
    epoch = parseInt(epoch, 10) || 0;
    if (!epoch) return "-";
    return new Date(epoch * 1000).toLocaleDateString();
  }

  function formatCount(n) {
    n = parseInt(n, 10) || 0;
    if (n >= 10000) return (n / 10000).toFixed(1) + "w";
    return String(n);
  }

  var STATUS_TEXT = { pending: "排队中", running: "下载中", success: "成功", failed: "失败" };

  function renderJobs(jobs) {
    var area = $("jobs-area");
    if (!jobs.length) {
      area.innerHTML = '<div class="empty">暂无任务</div>';
      return;
    }
    jobs.sort(function (a, b) { return (b.created_at || "").localeCompare(a.created_at || ""); });
    var rows = jobs.map(function (j) {
      var stats = j.total ? (j.success + "/" + j.total + (j.skipped ? "（跳过 " + j.skipped + "）" : "")) : "-";
      var err = j.error ? '<div class="status-failed">' + escapeHtml(j.error) + "</div>" : "";
      var qualityTag = (j.options && j.options.video_quality)
        ? ' <span class="quality-cell">[' + escapeHtml(j.options.video_quality) + "]</span>"
        : "";
      return "<tr>" +
        '<td class="url" title="' + escapeHtml(j.url) + '">' + escapeHtml(j.url) + qualityTag + "</td>" +
        '<td class="status-' + j.status + '">' + (STATUS_TEXT[j.status] || j.status) + "</td>" +
        "<td>" + stats + err + "</td>" +
        "<td>" + formatTime(j.created_at) + "</td>" +
        "</tr>";
    }).join("");
    area.innerHTML =
      "<table><thead><tr><th>链接</th><th>状态</th><th>成功/总数</th><th>创建时间</th></tr></thead>" +
      "<tbody>" + rows + "</tbody></table>";
  }

  function refreshJobs() {
    api("/jobs").then(function (data) {
      renderJobs(data.jobs || []);
    }).catch(function () { /* 轮询失败静默，下一轮重试 */ });
  }

  function escapeHtml(text) {
    var div = document.createElement("div");
    div.textContent = text == null ? "" : String(text);
    return div.innerHTML;
  }

  function formatTime(iso) {
    if (!iso) return "-";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleString();
  }

  // 初始化
  refreshAuthStatus();
  refreshJobs();
  setInterval(refreshJobs, 3000);
  // 页面加载时若已有获取会话在跑（例如刷新页面），恢复轮询
  api("/auth/fetch/status").then(function (data) {
    if (data.status === "running") { setFlowRunning(true); startFlowPolling(); }
  }).catch(function () {});
})();
</script>
</body>
</html>
