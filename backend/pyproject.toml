[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "douyin-downloader"
version = "2.0.0"
description = "Douyin batch downloader with no-watermark support"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "aiohttp>=3.9.0",
    # storage/file_manager.py 运行时 import httpx，属必装依赖
    "httpx>=0.25",
    "aiofiles>=23.2.1",
    "aiosqlite>=0.19.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "python-dateutil>=2.8.2",
    "gmssl>=3.2.2",
    # core/ffmpeg.py 解析的静态 ffmpeg（直播回放 remux 用）；精确锁定保证可复现
    "imageio-ffmpeg==0.6.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40.0",
]
server = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4.0",
    "httpx>=0.25",
    # Property-based tests (tests/test_database_top_authors.py,
    # test_notifier_redactor_property.py, test_proxy_validator_parity.py).
    # Missing hypothesis caused 3 collection errors pre-fix.
    "hypothesis>=6.0",
]
all = [
    "douyin-downloader[browser,server,dev]",
]

[project.scripts]
douyin-dl = "cli.main:main"

[tool.uv]
# 本项目主要面向国内用户，默认走清华镜像，免去首次安装动辄十几分钟甚至超时。
# 需要走官方源时（海外网络、或镜像尚未同步的新版本），用环境变量覆盖，无需改本文件：
#   UV_DEFAULT_INDEX=https://pypi.org/simple
# 注意：uv.lock 记录了各包的来源 registry，换 index 会让 uv 认为 lock 过期并
# 重新解析（一次几分钟），属预期行为，不是出错。
[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.setuptools.packages.find]
include = ["cli*", "core*", "auth*", "config*", "control*", "storage*", "utils*", "tools*", "server*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
# aiosqlite's background worker thread occasionally outlives the test's
# event loop (TestClient's lifespan tears down the loop immediately after
# shutdown, but the worker may wake one more time to `call_soon_threadsafe`
# and hit `RuntimeError: Event loop is closed`). This is a known upstream
# aiosqlite/pytest-asyncio interaction, not our bug — the connection is
# already closed cleanly at the contract level.
filterwarnings = [
  "ignore:Exception in thread Thread-.*_connection_worker_thread:pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
